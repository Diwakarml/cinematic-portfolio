services:
  - type: web
    name: cinematic-portfolio
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.x
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
    autoDeploy: true
